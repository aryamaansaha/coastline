version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: coastline-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: coastline
    networks:
      - coastline-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coastline-backend
    restart: unless-stopped
    ports:
      - "8008:8008"  # Expose backend for testing
    env_file:
      - ./.env
    environment:
      # Container-specific overrides (these take precedence over env_file)
      - MONGODB_URI=mongodb://mongodb:27017/
      - BACKEND_PORT=8008
      # Pass through SMTP config from .env
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - FRONTEND_URL=${FRONTEND_URL}
      # Pass through JWT config
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      - mongodb
    networks:
      - coastline-network
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coastline-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - coastline-network

networks:
  coastline-network:
    driver: bridge

volumes:
  mongodb_data:
